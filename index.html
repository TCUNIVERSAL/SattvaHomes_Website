    <!-- Logo intro: shown once per visit, before the app loads, so there is no flash of the page underneath. -->
    <script>
      try {
        document.documentElement.classList.add('js')
        if (!location.hash && !sessionStorage.getItem('sattva-intro') && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
          document.documentElement.classList.add('logo-intro-first')
          sessionStorage.setItem('sattva-intro', '1')
        } else {
          document.documentElement.classList.add('ready')
        }
      } catch (e) {
        document.documentElement.classList.add('ready')
      }
    </script>
    <style>
      html { background: #f5f7fa }

      /* New logo: the original artwork assembles in the existing construction sequence. */
      .sattva-logo.sl-new { display: block; width: 144px; height: auto; overflow: visible; --logo-start: .15s; --origin-x: 50%; --origin-y: 50%; --left: 0%; --right: 100%; --bottom: 100% }
      .sl-new .sl-piece { transform-box: fill-box; transform-origin: var(--origin-x) var(--origin-y) }
      .sl-new.logo-animate .sl-piece { animation: logo-rise .36s ease both; animation-delay: calc(var(--logo-start) + var(--delay)) }
      .sl-new.logo-animate :is(.sl-foundation, .sl-line-left, .sl-line-right) { animation-name: logo-stretch; animation-duration: .54s; animation-timing-function: cubic-bezier(.6, 0, .2, 1) }
      .sl-new .sl-line-left { transform-origin: var(--right) var(--origin-y) }
      .sl-new .sl-line-right { transform-origin: var(--left) var(--origin-y) }
      .sl-new.logo-animate :is(.sl-wall-left, .sl-wall-right, .sl-chimney) { transform-origin: var(--origin-x) var(--bottom); animation-name: logo-grow; animation-duration: .39s; animation-timing-function: cubic-bezier(.3, .8, .3, 1) }
      .sl-new.logo-animate :is(.sl-roof-left, .sl-roof-right) { animation-name: logo-drop; animation-duration: .54s }
      .sl-new.logo-animate [class*="sl-pane-"] { animation-name: logo-light; animation-duration: .42s }
      .sl-new.logo-animate [class*="sl-letter-"] { animation-name: logo-letter; animation-duration: .42s }

      /* Shown by class, not the hidden attribute: Tailwind's base styles force [hidden] to display: none !important. */
      .logo-intro { position: fixed; inset: 0; z-index: 1000; background: #FBF8F2; display: none; place-content: center; justify-items: center; padding: 24px; transition: opacity .45s ease; cursor: pointer }
      html.logo-intro-first { overflow: hidden }
      html.logo-intro-first .logo-intro { display: grid }
      .logo-intro .sattva-logo.sl-new { width: min(440px, 80vw) }
      .logo-intro-skip { position: absolute; bottom: max(28px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); min-height: 44px; padding: 10px 20px; border: 1px solid #D9D1C3; border-radius: 4px; background: transparent; font: 500 14px "Manrope Variable", ui-sans-serif, system-ui, sans-serif; color: #595247; cursor: pointer }
      .logo-intro-skip:hover { color: #231F1C; border-color: #231F1C }
      .logo-intro-skip:focus-visible { outline: 3px solid #C69221; outline-offset: 4px }
      .logo-intro.is-leaving { opacity: 0; pointer-events: none }

      @keyframes logo-grow { from { transform: scaleY(0) } }
      @keyframes logo-stretch { from { transform: scaleX(0) } }
      @keyframes logo-rise { from { opacity: 0; transform: translateY(10px) } }
      @keyframes logo-light { 0% { opacity: 0; transform: scale(0) } 60% { transform: scale(1.12) } 100% { opacity: 1; transform: none } }
      @keyframes logo-drop { 0% { opacity: 0; transform: translateY(-45px) } 62% { opacity: 1; transform: translateY(0) } 78% { transform: translateY(-3px) } 100% { transform: none } }
      @keyframes logo-letter { 0% { opacity: 0; transform: translateY(-18px) } 65% { opacity: 1; transform: translateY(0) } 82% { transform: translateY(-2px) } 100% { transform: none } }
      @media (prefers-reduced-motion: reduce) { .sl-new.logo-animate .sl-piece { animation: none !important; opacity: 1; transform: none } .logo-intro { transition: none } }
    </style>
  </head>

      <button type="button" class="logo-intro-skip">Skip intro</button>
    </div>
    <script>
      // Fades out once the logo is built. Any click, key, scroll or touch skips ahead; the intro is
      // hidden again once faded, so it never blocks the page.
      ;(function () {
        var root = document.documentElement
        if (!root.classList.contains('logo-intro-first')) return
        var intro = document.querySelector('.logo-intro')
        var events = ['click', 'keydown', 'wheel', 'touchstart']
        var done = false
        var finish = function () {
          if (done) return
          done = true
          root.classList.remove('logo-intro-first')
          root.classList.add('ready')
        }
        var leave = function () {
          events.forEach(function (type) { document.removeEventListener(type, leave) })
          intro.classList.add('is-leaving')
          intro.addEventListener('transitionend', finish, { once: true })
          setTimeout(finish, 600)
        }
        events.forEach(function (type) { document.addEventListener(type, leave, { passive: true }) })
        setTimeout(leave, 3150)
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
