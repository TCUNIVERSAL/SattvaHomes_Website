    <!-- Logo intro: shown once per visit, before the app loads, so there is no flash of the page underneath. -->
    <script>
      try {
        if (!location.hash && !sessionStorage.getItem('sattva-intro') && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
          document.documentElement.classList.add('intro-on')
          sessionStorage.setItem('sattva-intro', '1')
        } else {
          document.documentElement.classList.add('ready')
        }
      } catch (e) {
        document.documentElement.classList.add('ready')
      }
    </script>
    <style>
      html { background: #090d16 }
      .logo-intro { display: none }
      html.intro-on { overflow: hidden }
      html.intro-on .logo-intro {
        display: grid; place-items: center; position: fixed; inset: 0; z-index: 100; cursor: pointer;
        background: radial-gradient(60% 50% at 50% 45%, #1a2236 0%, #090d16 70%);
        animation: intro-out .7s ease 2.9s forwards;
      }
      html.intro-on .logo-intro.skip { animation: intro-out .25s ease forwards }
      .logo-intro .sattva-logo { width: min(84vw, 520px) }
      @keyframes intro-out { to { opacity: 0; visibility: hidden } }

      .sattva-logo { display: block; height: auto; overflow: visible; stroke: none }
      .sattva-logo .n { fill: #f4f0e8 }
      .sattva-logo .g { fill: #c9a06a }
      .sattva-logo .grow, .sattva-logo .pane path, .sattva-logo .line { transform-box: fill-box }
      .sattva-logo .grow { transform-origin: 50% 100% }
      .sattva-logo .pane path { transform-origin: center }
      .sattva-logo .line-l { transform-origin: right center }
      .sattva-logo .line-r { transform-origin: left center }
      .sattva-logo .sweep { stroke-dasharray: 1; stroke-dashoffset: 0 }
      .sattva-logo .wall-l { animation: sl-grow .39s cubic-bezier(.3,.8,.3,1) .06s both }
      .sattva-logo .wall-r { animation: sl-grow .39s cubic-bezier(.3,.8,.3,1) .13s both }
      .sattva-logo .roof { animation: sl-drop .54s .42s both }
      .sattva-logo .chimney { animation: sl-grow .3s cubic-bezier(.3,1.7,.5,1) .87s both }
      .sattva-logo .sweep { animation: sl-draw .66s cubic-bezier(.55,0,.35,1) 1.02s both }
      .sattva-logo .pane path { animation: sl-light .42s ease both; animation-delay: calc(1.53s + var(--i) * .048s) }
      .sattva-logo .word path { animation: sl-brick .42s both; animation-delay: calc(1.62s + var(--i) * .054s) }
      .sattva-logo .line { animation: sl-stretch .54s cubic-bezier(.6,0,.2,1) 1.98s both }
      .sattva-logo .homes path { animation: sl-fade-up .36s ease both; animation-delay: calc(2.01s + var(--i) * .036s) }
      @keyframes sl-grow { from { transform: scaleY(0) } }
      @keyframes sl-draw { from { stroke-dashoffset: 1 } }
      @keyframes sl-stretch { from { transform: scaleX(0) } }
      @keyframes sl-fade-up { from { opacity: 0; transform: translateY(18px) } }
      @keyframes sl-light { 0% { transform: scale(0); fill: #c9a06a } 55% { transform: scale(1.12); fill: #c9a06a } 100% { transform: none } }
      @keyframes sl-drop { 0% { transform: translateY(-260px); opacity: 0; animation-timing-function: cubic-bezier(.55,0,1,.45) } 45% { opacity: 1 } 62% { transform: translateY(0); animation-timing-function: cubic-bezier(0,.55,.45,1) } 78% { transform: translateY(-14px); animation-timing-function: cubic-bezier(.55,0,1,.45) } 100% { transform: none } }
      @keyframes sl-brick { 0% { transform: translateY(-90px); opacity: 0; animation-timing-function: cubic-bezier(.55,0,1,.45) } 65% { transform: translateY(0); opacity: 1; animation-timing-function: cubic-bezier(0,.55,.45,1) } 82% { transform: translateY(-8px) } 100% { transform: none } }
      @media (prefers-reduced-motion: reduce) { .logo-intro { display: none !important } }
    </style>

    <script>
      // Any click or key skips the intro; it is removed once faded so it never blocks the page.
      ;(function () {
        var root = document.documentElement
        if (!root.classList.contains('intro-on')) return
        var intro = document.querySelector('.logo-intro')
        var done = false
        var skip = function () { intro.classList.add('skip') }
        var finish = function () {
          if (done) return
          done = true
          root.classList.remove('intro-on')
          root.classList.add('ready')
          document.removeEventListener('keydown', skip)
        }
        intro.addEventListener('click', skip)
        document.addEventListener('keydown', skip, { once: true })
        intro.addEventListener('animationend', function (e) { if (e.animationName === 'intro-out') finish() })
        setTimeout(finish, 4500)
      })()
    </script>
